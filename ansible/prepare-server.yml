---
- name: Prepare Ubuntu Server

  hosts: web

  become: true

  tasks:

    - name: Update apt cache

      apt:

        update_cache: yes

    - name: Install Docker

      apt:

        name: docker.io

        state: present

    - name: Install Git

      apt:

        name: git

        state: present

    - name: Start Docker

      service:

        name: docker

        state: started

        enabled: true

    - name: Add ubuntu user to docker group

      user:

        name: ubuntu

        groups: docker

        append: yes