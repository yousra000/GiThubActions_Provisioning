name: CI

on:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests
        run: npm test

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build Docker Image
        run: |
          docker build \
            -t ${{ secrets.DOCKER_USERNAME }}/nodejs-app:${{ github.sha }} \
            -t ${{ secrets.DOCKER_USERNAME }}/nodejs-app:latest \
            .

      - name: Push Commit Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/nodejs-app:${{ github.sha }}

      - name: Push Latest Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/nodejs-app:latest